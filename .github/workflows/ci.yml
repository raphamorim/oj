name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The optimizer + sidecar-harness unit tests shell out to a real esbuild
      # from the start-app fixture; install it so they run instead of skipping.
      - name: install start-app fixture (esbuild for optimizer tests)
        run: npm ci --prefix e2e/fixtures/start-app
      - name: js unit tests (adapter helpers)
        run: node --test e2e/unit/*.test.mjs
      - name: fuzz targets still build
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  e2e:
    name: e2e (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [unbundled, bundle]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            playground/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix playground
      - run: npm install --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: run e2e suite
        run: node e2e/run.mjs ${{ matrix.mode == 'bundle' && '--bundle' || '' }}
      - name: warm-cache plugin side effects
        if: matrix.mode == 'unbundled'
        run: node e2e/warm-cache.mjs
      - name: ssr dev + hydration
        if: matrix.mode == 'unbundled'
        run: node e2e/ssr-dev.mjs
      - name: ssr streaming prod build + hydration
        if: matrix.mode == 'unbundled'
        run: node e2e/ssr-prod.mjs
      - name: server fast-paths (cache bound, mtime, hmr gating)
        if: matrix.mode == 'unbundled'
        run: |
          node e2e/memory-cache.mjs
          node e2e/mtime-fastpath.mjs
          node e2e/hmr-hook-skip.mjs
      - name: startup compile error overlay + recovery by reload
        if: matrix.mode == 'unbundled'
        run: node e2e/hmr-overlay-recovery.mjs
      - name: json import edit reaches the boundary (stamped import)
        if: matrix.mode == 'unbundled'
        run: node e2e/hmr-json-update.mjs
      - name: unresolved relative import errors, creating the file recovers
        if: matrix.mode == 'unbundled'
        run: node e2e/hmr-unresolved-import.mjs
      - name: server.proxy regex (^) contexts match path plus query
        if: matrix.mode == 'unbundled'
        run: node e2e/proxy-regex-context.mjs
      - name: request paths (encoded filenames, traversal containment)
        if: matrix.mode == 'unbundled'
        run: node e2e/awkward-paths.mjs
      - name: plugin resolveId without a load hook serves from disk
        if: matrix.mode == 'unbundled'
        run: node e2e/plugin-resolve-no-load.mjs
      - name: client env define (dotenv + process env + plugin config mutations)
        if: matrix.mode == 'unbundled'
        run: node e2e/env-define.mjs
      - name: a vite.config that fails to load is an error, not an empty config
        if: matrix.mode == 'unbundled'
        run: node e2e/config-load-failure.mjs
      # These drive a dev server (and svgr-plugin also a browser via playwright),
      # so they belong here where e2e deps + chromium are installed, not in the
      # prod build smoke job, which has neither.
      - name: plugin load runs before the disk read (load-first)
        if: matrix.mode == 'unbundled'
        run: node e2e/plugin-load-first.mjs
      - name: plain .svg import goes through the svgr plugin transform
        if: matrix.mode == 'unbundled'
        run: node e2e/svgr-plugin.mjs
      - name: .js-suffixed aliased and tsconfig-paths imports remap to .ts (dev + build)
        if: matrix.mode == 'unbundled'
        run: node e2e/ts-output-remap.mjs
      - name: require() in a served CJS dep resolves with the require condition
        if: matrix.mode == 'unbundled'
        run: node e2e/cjs-require-condition.mjs
      - name: optimizeDeps.exclude'd packages run through every plugin load/transform
        if: matrix.mode == 'unbundled'
        run: node e2e/plugin-excluded-dep.mjs
      - name: start prod build honors outDir, base, sourcemap, minify
        if: matrix.mode == 'unbundled'
        run: node e2e/start-build-options.mjs
      - name: throwing lifecycle hooks fail the build and dev startup
        if: matrix.mode == 'unbundled'
        run: node e2e/plugin-lifecycle-errors.mjs
      - name: this.resolve / this.load consult sibling plugins first
        if: matrix.mode == 'unbundled'
        run: node e2e/plugin-ctx-chain.mjs
      - name: plugin config() define reaches dev and build compiles
        if: matrix.mode == 'unbundled'
        run: node e2e/plugin-config-define.mjs
      - name: removed files reach hotUpdate / watchChange as delete
        if: matrix.mode == 'unbundled'
        run: node e2e/plugin-hot-update-delete.mjs
      - name: start dev applies config define to the client bundle; --mode selects .env.<mode>
        if: matrix.mode == 'unbundled'
        run: node e2e/start-define-mode.mjs
      - name: start prod build honors ssr.external (bare imports, server still renders)
        if: matrix.mode == 'unbundled'
        run: node e2e/start-ssr-external.mjs

  # i need to fix this or automate
  build:
    name: prod build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix playground
      - run: cargo run -p oj -- build playground
      - name: reject unresolved build imports
        run: node e2e/build-unresolved.mjs
      - name: check outputs
        run: |
          test -f playground/dist/index.html
          ls playground/dist/assets/*.js
          # publicDir assets are copied to the build output
          test -f playground/dist/robots.txt
          # the html's <link rel="stylesheet"> is bundled like Vite: emitted as a
          # hashed asset and the href rewritten to it
          grep -qE 'href="/assets/tailwind-[A-Za-z0-9_-]+\.css"' playground/dist/index.html
          grep -q underline playground/dist/assets/tailwind-*.css
          test -f playground/dist/.vite/manifest.json
          grep -q isEntry playground/dist/.vite/manifest.json
          grep -rq hello-from-env playground/dist/assets/*.js
          ! grep -rq must-not-leak playground/dist/assets/*.js
          # npm plugin hooks run in the prod build too
          grep -rq transformed-by-plugin playground/dist/assets/*.js
          grep -rq production:oj-plugin playground/dist/assets/*.js
          ! grep -rq __OJ_PLUGIN_UNTRANSFORMED__ playground/dist/assets/*.js
          grep -q 'oj-plugin-injected' playground/dist/index.html
          # enforce ordering holds and apply gating flips to build in prod
          grep -rq base-pre-post playground/dist/assets/*.js
          grep -rq build-only playground/dist/assets/*.js
          ! grep -rq serve-only playground/dist/assets/*.js
          # buildStart + buildEnd lifecycle hooks fired during the build
          test "$(cat playground/.oj-cache/plugin-buildstart)" = build
          test "$(cat playground/.oj-cache/plugin-buildend)" = build
          # plugin context: this.resolve injected the resolved basename, and
          # this.emitFile wrote an asset into the output
          grep -rq 'Counter.tsx' playground/dist/assets/*.js
          ! grep -rq __RESOLVED__ playground/dist/assets/*.js
          test "$(cat playground/dist/assets/oj-plugin-emitted.txt)" = emitted-by-plugin
          # this.load + getModuleInfo: Counter's imported-id count and code probe
          grep -rq '3:true' playground/dist/assets/*.js
          ! grep -rq __MODINFO__ playground/dist/assets/*.js
          # this.getModuleIds: the marker was replaced during transform
          grep -rq 'data-moduleids' playground/dist/assets/*.js
          ! grep -rq __MODULEIDS__ playground/dist/assets/*.js
          # Environment API: client-gated plugin ran, ssr-gated plugin did not
          grep -rq 'client-ran' playground/dist/assets/*.js
          ! grep -rq 'ssr-ran' playground/dist/assets/*.js
          # generateBundle: emitted a report asset (read bundle + emitFile) and
          # mutated the entry chunk (banner prepended)
          grep -q 'chunks:' playground/dist/oj-build-report.txt
          grep -rq 'oj-gb-banner' playground/dist/assets/*.js
          # renderChunk mutated the entry chunk; writeBundle ran post-write
          grep -rq 'oj-rc-ran' playground/dist/assets/*.js
          grep -q 'assets/' playground/.oj-cache/plugin-writebundle
          # renderStart + closeBundle lifecycle bookends fired
          test -f playground/.oj-cache/plugin-renderstart
          test -f playground/.oj-cache/plugin-closebundle
          # config define + client-environment define applied to the client build
          grep -rq 'global-define|client-define' playground/dist/assets/*.js
          ! grep -rq __OJ_DEFINE_ playground/dist/assets/*.js
      - name: explicit build inputs (multi-page, no root index.html)
        run: node e2e/multi-html-input.mjs
      - name: plugin emitFile chunk spine (getFileName resolves hashed name)
        run: node e2e/emit-chunk-build.mjs
      - name: plugin emitFile chunk from buildStart (crx manifest-root pattern)
        run: node e2e/emit-chunk-buildstart.mjs
      - name: generateBundle fidelity (rich chunk fields, rename, delete)
        run: node e2e/generate-bundle-fidelity.mjs
      - name: plugin emitFile .html chunk (crx page pattern)
        run: node e2e/emit-html-chunk.mjs
      - name: plugin-loaded virtual .jsx keeps JSX semantics
        run: node e2e/plugin-load-jsx.mjs
      - name: plugin transform runs on CSS sources before compile
        run: node e2e/css-plugin-transform.mjs
      - name: vite:css-post shim routes plugin CSS into output (UnoCSS pattern)
        run: node e2e/vite-css-post-shim.mjs
      - name: .vite/manifest.json is present in the generateBundle bundle
        run: node e2e/vite-build-manifest-in-bundle.mjs
      - name: library build
        run: |
          mkdir -p /tmp/lib/src
          printf 'export const add = (a, b) => a + b;\n' > /tmp/lib/src/index.ts
          printf 'import { defineConfig } from "oj";\nexport default defineConfig({ build: { lib: { entry: "src/index.ts", name: "L", formats: ["es", "cjs", "umd"] } } });\n' > /tmp/lib/oj.config.ts
          cargo run -p oj -- build /tmp/lib
          # Vite's lib file names for a package without "type": "module"
          test -f /tmp/lib/dist/index.mjs
          test -f /tmp/lib/dist/index.js
          test -f /tmp/lib/dist/index.umd.js
      - name: ssr build + streaming prod server
        run: node e2e/ssr-prod.mjs
      - name: ssr build passes --mode to both plugin hosts
        run: node e2e/ssr-build-mode.mjs
      - name: ssr dev
        run: node e2e/ssr-dev.mjs
      - name: preview smoke
        run: |
          (cargo run -p oj -- preview playground &)
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/ | grep -q 'id="root"'
          test "$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:4173/deep/route)" = 200
          # hashed assets are immutable; html revalidates
          asset=$(curl -sf http://localhost:4173/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sf -D - -o /dev/null "http://localhost:4173$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          curl -sf -D - -o /dev/null http://localhost:4173/ | grep -qi 'cache-control: no-cache'
          lsof -ti:4173 -sTCP:LISTEN | xargs -r kill || true
